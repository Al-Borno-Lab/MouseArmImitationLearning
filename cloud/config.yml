cloud:
  project_id: your_project_id
  bucket: your_bucket_id

data:
  repository: your_repository
  token: your_token

  kinematics: kinematics

  firing_rates:

  spikes:
    folder_or_file: 
    output_folder_or_file: 
    num_steps: 
    step_dt: 

compute:
  region: us-west4
  number_of_vms: 1
  machine_type: n1-standard-4
  gpu: nvidia-tesla-t4
  size_gb: 100

jobs:
  environment.model:
    - value: torque
      parameters:
          algorithm.learning_rate: 1.0e-05
          algorithm.clip_range: 0.15
          algorithm.clip_range_vf: 0.15
          algorithm.max_grad_norm: 0.15
          training.timesteps: 250000

  model.rnn_type:
    - ffn

  model.rnn_hidden_size:
    - 256

  model.rnn_layers:
    - 1

  general.seed:
    - 1
